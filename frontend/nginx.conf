server {
    listen 80;
    server_name localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Angular SPA routing ───────────────────────────────
    # Any path that isn't a real file falls back to index.html
    # so Angular's router handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy to Spring Boot backend ─────────────────
    # Requests to /api/... are forwarded to the backend container.
    # Because both containers share the Docker network, we can
    # use the service name "backend" as the hostname.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }

    # ── Security headers ──────────────────────────────────
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";

    # ── Compression ───────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml application/xml
                    application/x-font-ttf image/svg+xml;
    gzip_min_length 1000;
}
