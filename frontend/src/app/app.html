<!-- This is the main application template for the Nutrition Tracker app.
It includes a navigation bar that is only displayed when the user is
logged in, and a router outlet for displaying different components
based on the current route. -->

<nav class="navbar" *ngIf="isLoggedIn()">
    <div class="nav-brand">Nutrition Tracker</div>
    <div class="nav-links">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/food-search" routerLinkActive="active">Food Search</a>
        <a routerLink="/profile" routerLinkActive="active">Profile</a>
    </div>
    <button class="logout-btn" (click)="logout()">Logout</button>
</nav>

<router-outlet />
