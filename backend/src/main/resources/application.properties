# Application properties for the Nutrition Tracker backend service
#
spring.application.name=backend

# Server
server.port=8080

# Database — injected by Docker Compose via environment block
# Fallback values are for local development only
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nutrition_tracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — injected by Docker Compose
app.jwt.secret=${JWT_SECRET:dev_secret_not_for_production_change_this}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS — comma-separated allowed origins injected by Docker Compose
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}