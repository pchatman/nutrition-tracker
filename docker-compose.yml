# version: '3.9'

services:

  # ── Database ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: nutrition-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data          # persistent data volume
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # seed on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Expose port 5432 to your host so you can connect with DBeaver/pgAdmin
    # Remove this block if you prefer the DB to be completely internal
    ports:
      - "5432:5432"

  # ── Backend ──────────────────────────────────────────────
  backend:
    container_name: nutrition-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST:              db         # resolves to the db service on the Docker network
      DB_PORT:              5432
      DB_NAME:              ${DB_NAME}
      DB_USER:              ${DB_USER}
      DB_PASSWORD:          ${DB_PASSWORD}
      JWT_SECRET:           ${JWT_SECRET}
      JWT_EXPIRATION:       ${JWT_EXPIRATION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy   # waits until postgres passes its health check

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    container_name: nutrition-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"          # access app at http://localhost:4200
    depends_on:
      - backend

volumes:
  postgres_data:
    name: nutrition_postgres_data    # named volume survives container restarts

networks:
  default:
    name: nutrition-network
